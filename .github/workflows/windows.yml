name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Normalize formatting in workspace
        shell: bash
        run: cargo fmt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Launch smoke test
        shell: pwsh
        timeout-minutes: 1
        run: |
          $exe = Resolve-Path "target/x86_64-pc-windows-msvc/release/ai.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Ai.exe exited during the startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Remove-Item -Recurse -Force "data" -ErrorAction SilentlyContinue

      - name: Package Ai.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ai.exe dist/Ai.exe

      - name: Upload Ai.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ai-windows-x64
          path: dist/Ai.exe
