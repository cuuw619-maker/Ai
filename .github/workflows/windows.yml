name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: windows-ci
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Apply rustfmt and upload normalized sources
        shell: pwsh
        run: |
          cargo fmt --all
          Compress-Archive -Path src,tests,Cargo.toml -DestinationPath fmt-source.zip -Force
          git diff -- src/model.rs src/architecture/ainet.rs src/architecture/mod.rs src/architecture/aicell.rs src/training/evaluation.rs src/training/mod.rs src/training/trainer.rs src/training/checkpoint.rs src/main.rs > rustfmt.patch

      - name: Upload normalized sources and patch
        uses: actions/upload-artifact@v4
        with:
          name: fmt-source-${{ github.run_id }}
          path: |
            fmt-source.zip
            rustfmt.patch

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Ai.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ai.exe dist/Ai.exe

      - name: Upload Ai.exe
        uses: actions/upload-artifact@v4
        with:
          name: Ai-windows-x64
          path: dist/Ai.exe
