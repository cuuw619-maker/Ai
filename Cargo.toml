[package]
name = "ai"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AiNet v1: a from-scratch recurrent neural network implemented in Rust."

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[dependencies]
eframe = "0.33"
rfd = "0.15"
sysinfo = "0.37"
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12"
url = "2.5"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
bzip2 = "0.4"
